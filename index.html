<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>sushuhu | 个人主页</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      line-height: 1.6;
      color: #222;
      background: #f7f7f7;
    }
    header {
      padding: 60px 20px;
      text-align: center;
      background: #fff;
    }
    header h1 {
      margin: 0 0 10px;
      font-size: 2.2rem;
    }
    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 30px 20px;
    }
    .projects {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 14px rgba(0,0,0,.06);
    }
    .card h3 { margin-top: 0; }
    .tags {
      color: #666;
      font-size: .9rem;
    }
    .card a {
      display: inline-block;
      margin-right: 10px;
      margin-top: 8px;
      color: #0969da;
      text-decoration: none;
    }
    footer {
      text-align: center;
      padding: 30px;
      color: #777;
    }
  </style>
</head>
<body>
  <header>
    <h1>sushuhu</h1>
    <p>一句话介绍：比如“前端 / Python / 数据分析爱好者”</p>
    <p>
      <a href="https://github.com/你的用户名">GitHub</a> ·
      <a href="mailto:你的邮箱">邮箱</a>
    </p>
  </header>

  <main>
    <h2>我的项目</h2>
    <div class="projects">
      <article class="card">
        <h3>项目一</h3>
        <p>一句话说明这个项目做了什么。</p>
        <p class="tags">Python · Flask · SQLite</p>
        <a href="https://github.com/你的用户名/项目一仓库" target="_blank">源码</a>
        <a href="https://项目一演示地址" target="_blank">演示</a>
      </article>

      <article class="card">
        <h3>项目二</h3>
        <p>一句话说明这个项目做了什么。</p>
        <p class="tags">HTML · CSS · JavaScript</p>
        <a href="https://github.com/你的用户名/项目二仓库" target="_blank">源码</a>
      </article>
    </div>
  </main>

  <footer>
    © 2026 sushuhu
  </footer>
</body>
</html>
